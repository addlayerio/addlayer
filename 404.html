<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page not found | AddLayer</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#101318" />
    <style>
      :root { --background: 220 20% 8%; --foreground: 0 0% 95%; --muted-foreground: 220 15% 65%; --addlayer-green: 162 82% 65%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 { font-size: 3rem; font-weight: 700; margin: 0 0 1rem; }
      p { font-size: 1.25rem; color: hsl(var(--muted-foreground)); margin: 0 0 1rem; }
      a { color: hsl(var(--addlayer-green)); text-decoration: underline; }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <p>Oops! Page not found</p>
      <a href="./">Return to Home</a>
    </div>
  </body>
</html>
